services:
  laravel:
    extends:
      file: compose.common.yaml
      service: laravel
    # OCTANE_PORT, not PORT: PORT is a name too many things set (PaaS platforms, and plain
    # interactive shells — it was already set to 0 on a dev machine here, which silently made
    # Octane bind a random port while the publish still pointed at 80). It must stay in sync with
    # the container side of `ports` in compose.common.yaml and with CADDY_HTTP_PORT, which the
    # base image's HEALTHCHECK uses.
    command: ["php", "artisan", "octane:start", "--server=frankenphp", "--host=0.0.0.0", "--port=${OCTANE_PORT:-80}", "--admin-port=${CADDY_ADMIN_PORT:-2019}", "--workers=${OCTANE_WORKERS:-auto}", "--caddyfile=/etc/frankenphp/Caddyfile"]

  task:
    extends:
      file: compose.common.yaml
      service: task

  horizon:
    extends:
      file: compose.common.yaml
      service: horizon

  mariadb:
    extends:
      file: compose.common.yaml
      service: mariadb
    environment:
      # Distinct from DB_PASSWORD, and required: the common file defaults it to empty so that
      # development can rely on MARIADB_ALLOW_EMPTY_PASSWORD.
      MARIADB_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD required}'

  redis:
    extends:
      file: compose.common.yaml
      service: redis

volumes:
  caddy_config:
  caddy_data:
  mariadb:
  redis:
