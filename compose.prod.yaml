services:
  laravel:
    extends:
      file: compose.common.yaml
      service: laravel
    command: ["unbuffer", "php", "artisan", "octane:start", "--server=frankenphp", "--host=0.0.0.0", "--port=${PORT:-80}", "--admin-port=${CADDY_ADMIN_PORT:-2019}", "--workers=${OCTANE_WORKERS:-auto}", "--caddyfile=/etc/frankenphp/Caddyfile"]

  task:
    extends:
      file: compose.common.yaml
      service: task

  queue:
    extends:
      file: compose.common.yaml
      service: queue

  mysql:
    extends:
      file: compose.common.yaml
      service: mysql

  redis:
    extends:
      file: compose.common.yaml
      service: redis

volumes:
  caddy_config:
  caddy_data:
  mysql:
  redis:
