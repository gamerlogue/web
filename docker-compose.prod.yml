services:
    laravel:
        build:
            context: .
            args:
                WWWGROUP: '${WWWGROUP-1000}'
                MYSQL_CLIENT: mariadb-client
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8888}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
            - '443:443'
            - '443:443/udp'
        env_file:
          - .env
        environment:
            WWWUSER: '${WWWUSER-1000}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            RUNNING_MIGRATIONS_AND_SEEDERS: true
        networks:
            - laravel
        depends_on:
            mariadb:
              condition: service_healthy
            redis:
              condition: service_healthy
            memcached:
              condition: service_healthy
            typesense:
              condition: service_healthy
    mariadb:
        image: 'mariadb:11'
        ports:
            - '${FORWARD_DB_PORT:-3307}:3306'
        environment:
          MARIADB_ROOT_PASSWORD: '${DB_PASSWORD}'
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: '${DB_DATABASE}'
          MARIADB_USER: '${DB_USERNAME}'
          MARIADB_PASSWORD: '${DB_PASSWORD}'
          MARIADB_ALLOW_EMPTY_PASSWORD: 'yes'
        volumes:
            - 'mariadb:/var/lib/mysql'
        networks:
            - laravel
        healthcheck:
            test: [ CMD, healthcheck.sh, '--connect', '--innodb_initialized' ]
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'redis:/data'
        networks:
            - laravel
        healthcheck:
            test: [ CMD, redis-cli, ping ]
            retries: 3
            timeout: 5s
    memcached:
        image: 'memcached:alpine'
        ports:
            - '${FORWARD_MEMCACHED_PORT:-11211}:11211'
        networks:
            - laravel
        healthcheck:
            test: [ CMD, nc, '-z', '127.0.0.1', '11211' ]
            timeout: 2s
            start_period: 3s
            interval: 10s
    typesense:
        image: 'typesense/typesense:26.0'
        ports:
            - '${FORWARD_TYPESENSE_PORT:-8108}:8108'
        environment:
            TYPESENSE_DATA_DIR: '${TYPESENSE_DATA_DIR:-/typesense-data}'
            TYPESENSE_API_KEY: '${TYPESENSE_API_KEY:-xyz}'
            TYPESENSE_ENABLE_CORS: '${TYPESENSE_ENABLE_CORS:-true}'
        volumes:
            - 'typesense:/typesense-data'
        networks:
            - laravel
        healthcheck:
          # there it is installing curl silently if not already installed.
          test: [ "CMD-SHELL", "apt install curl -y &>/dev/null || curl --silent --fail localhost:8108/health || exit 1" ]
          interval: 5s
          timeout: 5s
          retries: 10
networks:
    laravel:
        driver: bridge
volumes:
    mariadb:
        driver: local
    redis:
        driver: local
    typesense:
        driver: local
