services:
  laravel:
    restart: unless-stopped
    build:
      context: .
      target: prod
    user: '${WWWUSER-www-data}'
    extra_hosts:
      - '${SERVER_NAME:-laravel.localhost}:127.0.0.1'
    ports:
      - '${APP_PORT:-80}:80'
    # Set healthcheck to use our native healthcheck script for Octane
    healthcheck:
      test: [CMD, healthcheck-octane]
      start_period: 10s
    volumes:
      - caddy_config:/config:rw
      - caddy_data:/data:rw
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    security_opt:
      - no-new-privileges:true

  task:
    restart: unless-stopped
    build:
      context: .
      target: prod
    command: [php, /var/www/html/artisan, 'schedule:work']
    stop_signal: SIGTERM
    healthcheck:
      test: [CMD, healthcheck-schedule]
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    security_opt:
      - no-new-privileges:true

  queue:
    restart: unless-stopped
    build:
      context: .
      target: prod
    command: [php, /var/www/html/artisan, 'queue:work', --tries=3]
    stop_signal: SIGTERM
    healthcheck:
      # This is our native healthcheck script for the queue
      test: [CMD, healthcheck-queue]
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  horizon:
    restart: unless-stopped
    build:
      context: .
      target: prod
    command: [php, /var/www/html/artisan, horizon]
    stop_signal: SIGTERM
    healthcheck:
      test: [CMD, healthcheck-horizon]
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  mariadb:
    restart: unless-stopped
    image: 'mariadb:13'
    environment:
      MARIADB_AUTO_UPGRADE: 'yes'
      MARIADB_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:-}'
      MARIADB_DATABASE: '${DB_DATABASE}'
      MARIADB_USER: '${DB_USERNAME}'
      MARIADB_PASSWORD: '${DB_PASSWORD:?DB_PASSWORD required}'
    volumes:
      - 'mariadb:/var/lib/mysql'
    healthcheck:
      test: [ CMD, healthcheck.sh, '--connect', '--innodb_initialized' ]
      retries: 3
      timeout: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]

  redis:
    restart: unless-stopped
    image: 'redis:alpine'
    command: [redis-server, --maxmemory, '${REDIS_MAXMEMORY:-384mb}', --maxmemory-policy, allkeys-lru]
    volumes:
      - 'redis:/data'
    healthcheck:
      test: [CMD, redis-cli, ping]
      retries: 3
      timeout: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]

volumes:
  caddy_config:
  caddy_data:
  mariadb:
  redis:
