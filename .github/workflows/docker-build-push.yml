name: Build Docker image

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        default: ''
      push:
        description: Publish the image to GHCR
        type: boolean
        default: false
      version:
        description: Release tag, empty for an edge build
        type: string
        default: ''
      prerelease:
        description: Do not update latest for pre-releases
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Prepare image tags
        id: image
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          if [ -n "$VERSION" ]; then
            TAGS="$IMAGE:$VERSION"
            if [ "$PRERELEASE" != "true" ]; then
              TAGS="$TAGS,$IMAGE:latest"
            fi
          else
            TAGS="$IMAGE:edge,$IMAGE:$SHORT_SHA"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "scan=$IMAGE:${VERSION:-edge}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: ${{ steps.image.outputs.tags }}
          target: prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.scan }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
