#########################
# GitLab CI/CD configuration file
# This file is used to define the CI/CD pipeline for building and deploying Docker images to AWS ECR
# It includes the following stages:
# 1. precheck_tag_on_main: Ensures that tags are only created on the main branch
# 2. build: Builds the Docker image using Buildah and pushes it to AWS ECR
# 3. create_template: Generates deployment templates using Sitekit and pushes them to the repository
#########################
# Variables to set on the repo:
# AWS_WEB_HOST_PROD: The hosts (separated by commas) where the application will be deployed in production
#########################

default:
  tags:
    - docker_aws

stages:
  - precheck_tag_on_main
  - build
  - create_template

variables:
  DOCKER_BUILDKIT: 1

precheck_tag_on_main:
  image: alpine:3.20
  stage: precheck_tag_on_main
  rules:
    - if: '$CI_COMMIT_TAG'    # esegue solo per pipeline di tag
  script:
    - apk add --no-cache git
    - git fetch --no-tags origin main
    # Verifica che il commit taggato ($CI_COMMIT_SHA) sia un antenato di origin/main
    - |
      if git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/main; then
        echo "Tag $CI_COMMIT_TAG è su main (o discendente)."
      else
        echo "Tag $CI_COMMIT_TAG NON è su main. Interrompo la pipeline."
        exit 1
      fi

build:
  image: quay.io/buildah/upstream
  stage: build
  needs:
    - job: precheck_tag_on_main
  rules:
    # Tag on main ending with -prod -> production host
    - if: '$CI_COMMIT_TAG =~ /-prod$/'
      variables:
        AWS_ACCESS_KEY: '$AWS_ACCESS_KEY_PROD'
        AWS_SECRET_KEY: '$AWS_SECRET_KEY_PROD'
        ECR_REPO_PREFIX: '$ECR_REPO_PREFIX_PROD'
    # Any other tag on main -> development host
    - if: '$CI_COMMIT_TAG'
      variables:
        AWS_ACCESS_KEY: '$AWS_ACCESS_KEY_DEV'
        AWS_SECRET_KEY: '$AWS_SECRET_KEY_DEV'
        ECR_REPO_PREFIX: '$ECR_REPO_PREFIX_DEV'
  before_script:
    - buildah info
  variables:
    DOCKER_IMAGE_TAG: "${CI_PROJECT_NAME}:latest-${CI_COMMIT_TAG}"
    ECR_REPO_NAME: ${CI_PROJECT_NAME}
    # Use vfs with buildah. Docker offers overlayfs as a default, but Buildah
    # cannot stack overlayfs on top of another overlayfs filesystem.
    #    STORAGE_DRIVER: vfs
    # Write all image metadata in the docker format, not the standard OCI format.
    # Newer versions of docker can handle the OCI format, but older versions, like
    # the one shipped with Fedora 30, cannot handle the format.
    BUILDAH_FORMAT: docker
  script:
    - echo "Version ${VERSION}"
    - dnf install -y curl unzip awscli2

    - echo "********************************************************"
    - echo "AWS CLI CONFIGURATION"
    - aws configure set aws_access_key_id ${AWS_ACCESS_KEY}
    - aws configure set aws_secret_access_key ${AWS_SECRET_KEY}
    - aws configure set region ${AWS_DEFAULT_REGION}

    - echo "********************************************************"
    - echo "Create the AWS ECR repository if it does not exists" # Create the AWS ECR repository
    - aws ecr describe-repositories --repository-names ${ECR_REPO_NAME}

    - echo "********************************************************"
    - echo "BUILDING THE IMAGE FOR ${CI_PROJECT_NAME} " # BUILD THE IMAGE AND PUSH IT
    - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | buildah login --username AWS --password-stdin ${ECR_REPO_PREFIX}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com
    - buildah build --target prod -t ${DOCKER_IMAGE_TAG} --secret=id=gitlab-ci-token,env=CI_JOB_TOKEN --layers=true
    - buildah tag ${DOCKER_IMAGE_TAG} ${ECR_REPO_PREFIX}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO_NAME}:${CI_COMMIT_TAG}
    - buildah push ${ECR_REPO_PREFIX}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO_NAME}:${CI_COMMIT_TAG}
    - buildah prune -a -f

create_template:
  stage: create_template
  image: gitlab/glab:latest
  variables:
    APP_NAME: ${CI_PROJECT_NAME}
    DOCKER_IMAGE_TAG: "${CI_COMMIT_TAG}"
    ECR_REPO_NAME: "${ECR_REPO_PREFIX}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${CI_PROJECT_NAME}"
    HOST: "${AWS_WEB_HOST_PROD}"
    # Prefer GLAB_TOKEN but also set GITLAB_TOKEN for compatibility
    GLAB_TOKEN: "$CI_JOB_TOKEN"
    GITLAB_TOKEN: "$CI_JOB_TOKEN"
  rules:
    # Tag on main ending with -prod -> production host
    - if: '$CI_COMMIT_TAG =~ /-prod$/'
      variables:
        AWS_ACCESS_KEY: '$AWS_ACCESS_KEY_PROD'
        AWS_SECRET_KEY: '$AWS_SECRET_KEY_PROD'
        ECR_REPO_PREFIX: '$ECR_REPO_PREFIX_PROD'
        APP_ENV: 'prod'
    # Any other tag on main -> development host
    - if: '$CI_COMMIT_TAG'
      variables:
        AWS_ACCESS_KEY: '$AWS_ACCESS_KEY_DEV'
        AWS_SECRET_KEY: '$AWS_SECRET_KEY_DEV'
        ECR_REPO_PREFIX: '$ECR_REPO_PREFIX_DEV'
        APP_ENV: 'dev'
  needs:
    - job: precheck_tag_on_main
    - job: build
      optional: true
  when: on_success
  script:
    - glab auth login --hostname $CI_SERVER_HOST --job-token $CI_JOB_TOKEN
    # Download sitekit latest release from GitLab
    - glab release download -R websites/utils/sitekit --asset-name "linux-x64"
    - chmod +x ./linux-x64
    - mv ./linux-x64 /usr/local/bin/sitekit
    - sitekit --version

    # Set git config to push changes
    - git config --global user.email "system@gitlab.trust-itservices.com"
    - git config --global user.name "Gitlab"
    # clone the repository
    # install dependencies
    # run the script with the correct input parameters
    - sitekit ci:helm ${ECR_REPO_NAME} ${DOCKER_IMAGE_TAG} ${APP_ENV} ${WEBSITE_NAME} ${HOST} ${APP_FILES_DIR}
