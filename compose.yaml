services:
  laravel:
    extends:
      file: compose.common.yaml
      service: laravel
    build:
      target: dev
    depends_on:
      - mailpit
    user: "${WWWUSER-www-data}"
    ports:
      - '443:443'
      - '443:443/udp'
      - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
    hostname: '${SERVER_NAME:-laravel.localhost}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # Start Octane in worker mode
    command: ["${APP_BASE_PATH:-/var/www/html}/deployment/dev/start-container-dev.sh"]
    environment:
      # noinspection HttpUrlsUsage
      CADDY_HTTP_SERVER_ADDRESS: "http://${SERVER_NAME:-laravel.localhost}"
      CADDY_HTTPS_SERVER_ADDRESS: "https://${SERVER_NAME:-laravel.localhost}"
      LARAVEL_SAIL: 1
      PHP_IDE_CONFIG: '${PHP_IDE_CONFIG:-serverName=Sail}'
      TERMINAL_EMULATOR: ${TERMINAL_EMULATOR:-Jetbrains-JediTerm}
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-debug,develop}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal log=/tmp/xdebug.log}'
      WEBSERVER: ${WEBSERVER:-octane-watch}
    volumes:
      - '.:/var/www/html'
      # Terminates TLS for the Vite port: see the comment inside the file
      - './deployment/dev/vite.caddyfile:/etc/frankenphp/caddyfile.d/vite.caddyfile:ro'
      - ~/.config/composer/auth.json:/composer/auth.json:rw
      - ~/.cache/composer:/composer/cache:rw
      - ~/.bun/install/cache:/home/${WWWUSER:-www-data}/.bun/install/cache:rw
      - ~/.caddy/ca:/data/caddy/pki/authorities/local:rw
      - /tmp/sitekit:/tmp/sitekit

  task:
    extends:
      file: compose.common.yaml
      service: task
    build:
      target: dev

  queue:
    extends:
      file: compose.common.yaml
      service: queue
    build:
      target: dev
    volumes:
      - '.:/var/www/html'

  mariadb:
    extends:
      file: compose.common.yaml
      service: mariadb
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MARIADB_ALLOW_EMPTY_PASSWORD: 'yes'
      MARIADB_ROOT_HOST: '%'

  redis:
    extends:
      file: compose.common.yaml
      service: redis
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'

  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - '${FORWARD_MAILPIT_PORT:-1025}:1025'
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
    healthcheck:
      test: [ "CMD", "/mailpit", "readyz" ]
      interval: 15s

  # Follow https://github.com/johnpaulett/sham-oidc#container-setup
  oidc:
    image: "johnpaulett/sham-oidc"
    hostname: oidc-gamerlogue.localhost
    ports:
      - "4000:8000"
    volumes:
      - oidc-db:/data
    environment:
      SECRET_KEY: examplekey123
      DEBUG: "true"

volumes:
  caddy_config:
  caddy_data:
  mariadb:
  redis:
  oidc-db:
